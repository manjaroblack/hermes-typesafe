name: offline-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-only:
    name: Python ${{ matrix.python-version }} offline plugin tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch immutable Hermes integration fixture
        if: matrix.python-version == '3.12'
        env:
          HERMES_FIXTURE_SHA: ee4452991d17534aa561f31ee55596d082aa94e7
        run: |
          git init /tmp/hermes-typesafe-public-fixture
          git -C /tmp/hermes-typesafe-public-fixture remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-typesafe-public-fixture fetch --depth 1 origin "$HERMES_FIXTURE_SHA"
          git -C /tmp/hermes-typesafe-public-fixture checkout --detach FETCH_HEAD
          test "$(git -C /tmp/hermes-typesafe-public-fixture rev-parse HEAD)" = "$HERMES_FIXTURE_SHA"
      - name: Install locked project dependencies
        run: python -m pip install --disable-pip-version-check "uv==0.10.10"
      - name: Sync locked environment
        run: uv sync --locked --extra test
      - name: Build candidate wheel for installed integration
        run: uv run --no-sync python -m build --wheel --outdir /tmp/typesafe-candidate
      - name: Install candidate wheel
        run: uv pip install --python .venv/bin/python --force-reinstall /tmp/typesafe-candidate/hermes_typesafe-*.whl
      - name: Run installed-wheel two-home lane
        if: matrix.python-version == '3.12'
        env:
          TYPESAFE_API_KEY: ""
          HERMES_KANBAN_DB: ""
          HERMES_KANBAN_BOARD: ""
          HERMES_KANBAN_TASK: ""
          HERMES_KANBAN_WORKSPACE: ""
          HERMES_KANBAN_WORKSPACES_ROOT: ""
          HERMES_TYPESAFE_HERMES_FIXTURE: /tmp/hermes-typesafe-public-fixture
          HERMES_TYPESAFE_REQUIRE_FIXTURE: "true"
        run: uv run --no-sync pytest -q tests/test_two_home.py
      - name: Run offline suite
        env:
          TYPESAFE_API_KEY: ""
          HERMES_KANBAN_DB: ""
          HERMES_KANBAN_BOARD: ""
          HERMES_KANBAN_TASK: ""
          HERMES_KANBAN_WORKSPACE: ""
          HERMES_KANBAN_WORKSPACES_ROOT: ""
          HERMES_TYPESAFE_HERMES_FIXTURE: /tmp/hermes-typesafe-public-fixture
          HERMES_TYPESAFE_REQUIRE_FIXTURE: ${{ matrix.python-version == '3.12' }}
        run: uv run --no-sync pytest -q
      - name: Build wheel and sdist
        run: uv run python -m build --wheel --sdist

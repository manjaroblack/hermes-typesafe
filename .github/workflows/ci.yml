name: offline-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-only:
    name: Python ${{ matrix.python-version }} offline plugin tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked project dependencies
        run: python -m pip install --disable-pip-version-check "uv==0.10.10"
      - name: Sync locked environment
        run: uv sync --locked --extra test
      - name: Run offline suite
        env:
          TYPESAFE_API_KEY: ""
          HERMES_KANBAN_DB: ""
          HERMES_KANBAN_BOARD: ""
          HERMES_KANBAN_TASK: ""
          HERMES_KANBAN_WORKSPACE: ""
          HERMES_KANBAN_WORKSPACES_ROOT: ""
        run: uv run pytest -q
      - name: Build wheel and sdist
        run: uv run python -m build --wheel --sdist

name: typesafe
version: "0.1.0"
description: "Reviewed TypeSafe System One tool plus capability-gated suggestion, guardrail, final-screen, and routing hooks."
author: "Hermes TypeSafe maintainers"
kind: standalone
requires_env:
  - TYPESAFE_API_KEY
provides_tools:
  - system_one
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - transform_llm_output
python_dependencies:
  - "typesafe-sdk>=0.7,<0.9"
license: MIT
homepage: "https://github.com/manjaroblack/hermes-typesafe"
tags:
  - typesafe
  - typed-decisions
